<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>The Poetry Canvas</title>
</head>

<body>

  <h2 id="letter">?</h2>

  <p id="lineInstruction">
    Loading...
  </p>

  <textarea
    id="poetryInput"
    rows="3"
    placeholder="Write your line..."
  ></textarea>

  <br><br>

  <button id="submitLine">
    CREATE LINE
  </button>

  <p id="syllables">
    Syllables: 0
  </p>

  <p id="timer">
    Time: 0
  </p>

  <p id="message"></p>

  <div id="poetryPiece"></div>

  <canvas id="canvas"></canvas>

  <script src="script.js"></script>

</body>

</html>
